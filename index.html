<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Nantes — la carte à nous</title>
  <meta name="description" content="Nantes centre en 3D à explorer à pied, avec nos lieux, nos souvenirs et nos bons plans.">
  <meta name="theme-color" content="#1d2533">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261025160413">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <noscript><h1>Nantes — la carte à nous</h1><p>Cette carte 3D demande JavaScript.</p></noscript>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <header class="brand">
    <strong>Nantes</strong><span>la carte à nous</span>
    <code id="coords">—</code>
  </header>

  <nav class="tools">
    <button id="btn-sky" title="Vue du ciel (V)">🛰️ <span>Ciel</span></button>
    <button id="btn-edit" title="Placer des points (P)">📍 <span>Placer</span></button>
    <button id="export" hidden title="Copie le pois.json à mettre dans data/">📋 <span>Exporter</span></button>
  </nav>
  <p id="hint" hidden></p>
  <p class="help">ZQSD / flèches : marcher · Maj : courir · glisser : tourner · molette : zoom · V : ciel · P : placer · données © contributeurs <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></p>

  <section id="card" class="card" hidden>
    <button class="close" aria-label="Fermer">×</button>
    <span class="kicker"></span>
    <h2></h2>
    <p class="body"></p>
    <a class="link" target="_blank" rel="noopener" hidden></a>
    <button class="edit" hidden>Modifier</button>
  </section>

  <form id="editor" class="editor" hidden>
    <h3>Nouveau point</h3>
    <label>Emoji <input name="emoji" maxlength="4" value="📍"></label>
    <label>Titre <input name="title" required maxlength="60"></label>
    <label>Texte <textarea name="text" rows="4" maxlength="600"></textarea></label>
    <label>Qui <input name="by" maxlength="30" placeholder="Benjamin, un ami…"></label>
    <label>Couleur <select name="color">
      <option value="#ff6a4d">Corail</option><option value="#4d7cff">Bleu</option><option value="#ffc845">Jaune</option>
      <option value="#2f9e55">Vert</option><option value="#a25dd9">Violet</option><option value="#1d2533">Nuit</option>
    </select></label>
    <div class="row"><button type="submit" class="ok">Enregistrer</button><button type="button" class="cancel">Annuler</button><button type="button" class="del" hidden>Supprimer</button></div>
  </form>

  <div id="joy" class="joy" hidden aria-label="Joystick"><div class="joy-knob"></div></div>

  <div id="loading"><div class="box"><strong>Nantes</strong><div class="bar"><i></i></div><span class="msg">Construction de la ville…</span></div></div>

  <script type="module" src="src/main.js?v=20261025160413"></script>
</body>
</html>
